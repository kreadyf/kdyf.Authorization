# Publish a preview of the packages to the repository's own GitHub Packages feed, so that the applications' pipelines can
# restore it before anything is on nuget.org. A push to develop publishes 1.0.0-dev.<run number>. Any other branch is run
# by hand (Actions -> Publish preview -> Run workflow -> pick the branch) and publishes 1.0.0-<branch>.<run number>.
# The release workflow (a v* tag on master -> nuget.org) is a different, deliberate act.
#
# Needs nothing but the workflow's own token (GITHUB_TOKEN with packages: write). Consumers read the feed with a personal
# access token that has read:packages; see the NuGet.config of each application.

name: Publish preview

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-preview
  cancel-in-progress: false   # two pushes in a row publish two versions; neither is cancelled halfway

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # the migration tests run against SQL Server on both frameworks
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Kdyf-Ci-Only-1!x"   # a throwaway container of this job, not a secret
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # develop is "dev"; a branch is its own name, lower-cased and cleaned to what a pre-release label accepts.
      - name: Version suffix
        id: suffix
        run: |
          branch="${GITHUB_REF_NAME}"
          if [ "$branch" = "develop" ]; then
            label="dev"
          else
            label="$(echo "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9]+#-#g; s#^-+|-+$##g' | cut -c1-20 | sed -E 's#-+$##')"
            label="${label:-branch}"
          fi
          echo "value=${label}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Publishing 1.0.0-${label}.${{ github.run_number }}"

      - name: Build
        run: dotnet build kdyf.Authorization.slnx --configuration Release -warnaserror -p:VersionSuffix=${{ steps.suffix.outputs.value }}

      - name: Test
        env:
          KDYF_AUTHZ_TEST_SQLSERVER: "Server=localhost,1433;User ID=sa;Password=Kdyf-Ci-Only-1!x;TrustServerCertificate=true;Encrypt=true;Connect Timeout=60"
        run: dotnet test kdyf.Authorization.slnx --configuration Release --no-build

      - name: Pack
        run: >
          dotnet pack kdyf.Authorization.slnx --configuration Release --no-build --output artifacts/packages
          -p:VersionSuffix=${{ steps.suffix.outputs.value }}

      # GitHub Packages takes .nupkg only (no .snupkg symbols). --skip-duplicate: re-running a job is not an error.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
